services:
  flask:
    build:
      context: ./flask
      dockerfile: Dockerfile
    container_name: kaq-flask
    ports:
      - "5001:5001"
    restart: unless-stopped

  laravel:
    build:
      context: ./kaqapp
      dockerfile: Dockerfile
    container_name: kaq-laravel
    working_dir: /var/www/html
    volumes:
      - ./kaqapp:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      QR_API_URL: http://localhost:5001
    command: >
      sh -c "
      [ -f .env ] || cp .env.example .env &&
      sed -i 's|^APP_URL=.*|APP_URL=http://localhost:8080|' .env || true &&
      sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env || true &&
      sed -i 's|^DB_DATABASE=.*|DB_DATABASE=/var/www/html/database/database.sqlite|' .env || true &&
      sed -i 's|^SESSION_DRIVER=.*|SESSION_DRIVER=file|' .env || true &&
      sed -i 's|^CACHE_STORE=.*|CACHE_STORE=file|' .env || true &&
      sed -i 's|^QUEUE_CONNECTION=.*|QUEUE_CONNECTION=sync|' .env || true &&
      sed -i 's|^QR_API_URL=.*|QR_API_URL=http://localhost:5001|' .env || true &&
      grep -q '^QR_API_URL=' .env || echo 'QR_API_URL=http://localhost:5001' >> .env &&
      [ -f database/database.sqlite ] || touch database/database.sqlite &&
      composer install --no-interaction --prefer-dist &&
      php artisan config:clear &&
      php artisan key:generate --force &&
      php artisan migrate --force &&
      php artisan serve --host=0.0.0.0 --port=8000
      "
    ports:
      - "8080:8000"
    depends_on:
      - flask
    restart: unless-stopped

  vite:
    image: node:20-alpine
    container_name: kaq-vite
    working_dir: /app
    volumes:
      - ./kaqapp:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - laravel
    restart: unless-stopped
